name: reV Pytests

concurrency:
  group: rev-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout rex
        uses: actions/checkout@v3
        with:
          path: rex
      - name: checkout reV
        uses: actions/checkout@v3
        with:
          repository: NatLabRockies/reV
          fetch-depth: 1
          path: reV
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.13
      - name: Install rex dependencies
        working-directory: ./rex
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Install reV dependencies
        working-directory: ./reV
        run: |
          python -m pip install ".[bespoke,test]"
      - name: Run reV pytest
        working-directory: ./reV
        run: |
          python -m pip install pytest
          python -m pytest -v --disable-warnings
