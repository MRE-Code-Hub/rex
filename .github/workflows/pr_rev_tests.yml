name: reV Pytests

concurrency:
  group: rev-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout rex
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          fetch-tags: true
          path: rex
          persist-credentials: false
      - name: checkout reV
        uses: actions/checkout@v7.0.1
        with:
          repository: NatLabRockies/reV
          fetch-depth: 1
          path: reV
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.13
      - name: Install rex dependencies
        working-directory: ./rex
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Install reV dependencies
        working-directory: ./reV
        run: |
          python -m pip install ".[bespoke,test]"
      - name: Run reV pytest
        working-directory: ./reV
        run: |
          python -m pip install pytest
          python -m pytest -v --disable-warnings
