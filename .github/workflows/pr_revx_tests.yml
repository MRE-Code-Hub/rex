name: reVX Pytests

concurrency:
  group: revx-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout rex
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          fetch-tags: true
          path: rex
          persist-credentials: false
      - name: checkout reVX
        uses: actions/checkout@v2
        with:
          repository: NatLabRockies/reVX
          fetch-depth: 1
          path: reVX
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.11
      - name: Install reVX dependencies
        working-directory: ./reVX
        shell: bash -l {0}
        run: |
          conda install pip rtree pytest
          pip install geopandas
          pip install -e ".[flicker]"
      - name: Install rex
        working-directory: ./rex
        shell: bash -l {0}
        run: |
          pip install -e ".[test]"
      - name: Run reVX pytest
        working-directory: ./reVX
        shell: bash -l {0}
        run: |
          pytest -v --disable-warnings
